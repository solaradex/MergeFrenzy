<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>MergeFrenzy New Tab</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header class="topbar"><div><p class="eyebrow">NEW TAB GAME</p><h1>MergeFrenzy</h1><p class="subtitle">Merge numbers. Chase the highest tile.</p></div><button class="icon-button" id="newGameButton" type="button">New game</button></header><section class="scorebar"><div class="score-card"><span>Score</span><strong id="score">0</strong></div><div class="score-card"><span>Best</span><strong id="best">0</strong></div><div class="score-card"><span>Moves</span><strong id="moves">0</strong></div></section><section class="game-shell"><div class="game-head"><div><strong>2048-style merge</strong><span>Arrow keys, WASD, or swipe.</span></div><div class="controls"><button id="undoButton" type="button">Undo</button><button id="shuffleButton" type="button">Shuffle</button></div></div><div id="board" class="board" role="application" aria-label="MergeFrenzy board" tabindex="0"></div><div id="status" class="status" role="status" aria-live="polite">Your move.</div><div class="touch-controls"><button data-direction="up" type="button">↑</button><div><button data-direction="left" type="button">←</button><button data-direction="down" type="button">↓</button><button data-direction="right" type="button">→</button></div></div></section></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><div class="overlay-card"><h2 id="overlayTitle">Game over</h2><p id="overlayMessage"></p><button id="overlayButton" type="button">Play again</button></div></div><script src="game.js" defer></script></body></html>
